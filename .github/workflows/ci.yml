name: CI (Lint & Test)

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Lint & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OpenBioMaps documentation
        uses: actions/checkout@v4
        with:
          repository: OpenBioMaps/documentation
          path: documentation

      - name: Set up UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run linter (Ruff)
        run: uv run ruff check src scripts tests

      - name: Build index for tests
        run: uv run python -m scripts.build_index --docs-path documentation/official_docs/hu

      - name: Run unit tests (Pytest)
        run: uv run pytest
