name: Build & Publish Docker Image

on:
  push:
    branches: ["main", "master"]
    paths:
      - "src/**"
      - "scripts/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-and-publish.yml"
  # Eseményvezérelt indítás: meghívható a documentation repo-ból webhookkal
  repository_dispatch:
    types: [documentation_updated]
  # Ütemezett újraépítés (alapértelmezésben kikommentezve, ha inkább webhookot használsz):
  # schedule:
  #   - cron: '0 3 * * *'
  # Manuális indítás a GitHub Actions felületről
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: OpenBioMaps dokumentáció letöltése
        uses: actions/checkout@v4
        with:
          repository: OpenBioMaps/documentation
          path: documentation

      - name: Docker Buildx beállítása
        uses: docker/setup-buildx-action@v3

      - name: Bejelentkezés a GitHub Container Registry-be
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metaadatok kinyerése (címkék és leírók)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Docker image építése és feltöltése
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
